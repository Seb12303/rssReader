{% extends "base.html" %} {% block title %}Feed{% endblock %}

{% block content %}
<div class="container my-4">
  <div class="row g-4">
    {% for feed in artikler %}
        {% for article in feed['entries'] %}
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-3">
          <div class="card h-100">
              {% if hentBilde(article) != "" %}
              <img class="card-img-top" src="{{ hentBilde(article) }}" alt="{{ article.title }}">
              {% endif %}
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ article.title }}</h5>
                <p class="card-text text-truncate" style="max-height: 5rem; overflow: hidden;">{{ hentSummary(article) }}</p>
                <a href="{{ article.link }}" class="btn btn-primary mt-auto">Les mer</a>
              </div>
          </div>
        </div>
        {% endfor %}
    {% endfor %}
  </div>
</div>
{% endblock %}

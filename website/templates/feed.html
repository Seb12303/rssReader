{% extends "base.html" %} {% block title %}Feed{% endblock %}

{% block content %}
<div class="container my-4">
  <div class="row g-4">
      {% for article in artikler %}
      {% include 'article_card_big.html' %}
      {% endfor %}
  </div>
</div>

<!-- Bootstrap Modal -->
<div class="modal fade" id="articleModal" tabindex="-1" aria-labelledby="articleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="articleModalLabel">Article Title</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <img id="articleImage" src="" alt="" class="img-fluid mb-3">
        <p id="articleSummary"></p>
        <a id="articleLink" href="#" class="btn btn-primary" target="_blank">Gå til kilde</a>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Lukk</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

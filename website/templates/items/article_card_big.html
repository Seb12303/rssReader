<div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-3">
    <div class="card h-100 d-flex flex-column" style="display: flex;">
        {% if article.bilde != "" %}
        <img class="card-img-top" src="{{ article.bilde }}" alt="{{ article.title }}" 
             style="object-fit: cover; max-height: 200px; width: 100%;">
        {% endif %}
        <div class="card-body d-flex flex-column" style="flex-grow: 1;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <!-- Add domain as small grey text -->
                <div class="d-flex align-items-center gap-1">
                    {% if article.iconUrl %}
                    <img src="{{ article.iconUrl }}" style="height: 20px; width: 20px; border-radius: 25%;">
                    {% else %}
                    <p class="text-muted small mb-0">{{ hentDomain(article) }}</p>
                    {% endif %}
                </div>
                <!-- Add timestamp on the opposite side -->
                <p class="text-muted small mb-0">{{ hentTid(article, user_timezone) }}</p>
            </div>
            <!-- Update headline -->
            <h5 class="card-title">
                <a href="{{ article.link }}" style="color:black;">{{ article.title }}</a>
            </h5>
            <p class="card-text" 
               style="overflow: hidden; text-overflow: ellipsis; 
                      display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical;">
                {{ article.summary }}
            </p>
            <div class="mt-auto">
                <button type="button" class="btn btn-primary w-100 view-article-btn" 
                        data-bs-toggle="modal" 
                        data-bs-target="#articleModal"
                        data-title="{{ article.title }}"
                        data-image="{{ article.bilde }}"
                        data-summary="{{ article.summary }}"
                        data-link="{{ article.link }}">
                    Vis mer
                </button>
            </div>
        </div>
    </div>
</div>

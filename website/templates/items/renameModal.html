  <!-- Rename Group Modal -->
  <div class="modal fade" id="renameGroupModal{{ group.id }}" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Rename Group</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <form method="post" action="/rename_group/{{ group.id }}">
          <div class="modal-body">
            <input type="text" class="form-control" name="new_group_name" placeholder="New Group Name" required>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Rename</button>
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
